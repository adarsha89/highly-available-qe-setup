apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: qe-platform
spec:
  project: qe-platform
  source:
    repoURL: "https://github.com/adarsha89/highly-available-qe-setup.git"
    targetRevision: HEAD
    path: kubernetes/helm/monitoring
    helm:
      releaseName: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
