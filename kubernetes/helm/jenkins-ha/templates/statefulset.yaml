apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
spec:
  serviceName: {{ .Release.Name }}-controller
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        - name: install-plugins
          image: {{ .Values.controller.image }}
          command:
            - "sh"
            - "-c"
            - |
              if [ ! -f /var/jenkins_home/plugins/configuration-as-code.jpi ] && [ ! -f /var/jenkins_home/plugins/configuration-as-code.hpi ]; then
                echo "Installing Jenkins plugins via jenkins-plugin-cli..."
                jenkins-plugin-cli --plugins configuration-as-code kubernetes workflow-aggregator pipeline-stage-view git credentials-binding job-dsl prometheus ws-cleanup timestamper matrix-auth dark-theme -d /var/jenkins_home/plugins --latest true
              else
                echo "Plugins already installed."
              fi
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: {{ .Values.controller.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: {{ .Values.controller.javaOpts | quote }}
            - name: CASC_JENKINS_CONFIG
              value: "/var/jenkins_home/casc_configs/jenkins.yaml"
            - name: JENKINS_URL
              value: {{ .Values.controller.jenkinsUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.httpPort }}
            - name: agent
              containerPort: {{ .Values.controller.agentPort }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.controller.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.controller.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controller.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.controller.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.controller.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.controller.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.controller.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controller.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.controller.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.controller.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: casc-config
              mountPath: /var/jenkins_home/casc_configs
      volumes:
        - name: casc-config
          configMap:
            name: {{ .Release.Name }}-casc-config
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: jenkins-home
      spec:
        accessModes: [ {{ .Values.controller.persistence.accessMode | quote }} ]
        {{- if .Values.controller.persistence.storageClass }}
        storageClassName: {{ .Values.controller.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.controller.persistence.size | quote }}
