apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alertmanager-config
  namespace: {{ .Release.Namespace }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      group_by: ["alertname", "cluster", "service", "component"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: "qe-platform-webhook"
      routes:
        - match:
            severity: critical
          receiver: "qe-critical-alerts"
          continue: true

    receivers:
      # Webhook to the Central Automation Tracker (scraped once deployed; harmless if absent)
      - name: "qe-platform-webhook"
        webhook_configs:
          - url: "http://tracker-backend.automation-tracker.svc.cluster.local:8000/api/v1/alerts"
            send_resolved: true

      - name: "qe-critical-alerts"
        webhook_configs:
          - url: "http://tracker-backend.automation-tracker.svc.cluster.local:8000/api/v1/alerts/critical"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: "critical"
        target_match:
          severity: "warning"
        equal: ["alertname", "cluster", "service"]
