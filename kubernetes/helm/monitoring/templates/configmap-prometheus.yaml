apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - /etc/prometheus/alert-rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["{{ .Values.alertmanager.name }}:{{ .Values.alertmanager.port }}"]

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Jenkins Controller High Availability Monitoring
      - job_name: "jenkins"
        metrics_path: "/prometheus"
        scrape_interval: 15s
        static_configs:
          - targets: ["jenkins-service.jenkins.svc.cluster.local:8080"]

      # Central Automation Tracker Telemetry API (scraped once deployed; harmless if absent)
      - job_name: "automation-tracker"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["tracker-backend.automation-tracker.svc.cluster.local:8000"]

      # Kubernetes API server & control plane
      - job_name: "kubernetes-apiservers"
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

  alert-rules.yaml: |
{{ .Files.Get "files/alert-rules.yaml" | indent 4 }}
