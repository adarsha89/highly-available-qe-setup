backend:
  image: "qe-tracker-backend:latest"
  replicas: 2 # Highly available active-active backend
  port: 8000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1024Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

frontend:
  image: "qe-tracker-frontend:latest"
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

service:
  type: ClusterIP

pdb:
  enabled: true
  minAvailable: 1
