# Resource Quotas & Limits for QE Namespaces
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-quota
  namespace: jenkins
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50" # Supports dynamic agent pod scaling
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tracker-quota
  namespace: automation-tracker
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
