# Alertmanager Configuration - Deduplication, Routing & Notification Channels
global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "cluster", "service", "component"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: "qe-platform-webhook"
  routes:
    - match:
        severity: critical
      receiver: "qe-critical-alerts"
      continue: true

receivers:
  # Default webhook for local simulation / Tracker alerting
  - name: "qe-platform-webhook"
    webhook_configs:
      - url: "http://tracker-backend:8000/api/v1/alerts"
        send_resolved: true

  # Critical notification channel
  - name: "qe-critical-alerts"
    webhook_configs:
      - url: "http://tracker-backend:8000/api/v1/alerts/critical"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "cluster", "service"]
