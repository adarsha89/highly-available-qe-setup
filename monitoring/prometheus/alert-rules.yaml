# Prometheus High Availability Alerting Rules
groups:
  - name: qe-ha-infrastructure-alerts
    rules:
      # 1. Alert if Jenkins Controller goes down
      - alert: JenkinsControllerDown
        expr: up{job="jenkins"} == 0
        for: 30s
        labels:
          severity: critical
          component: jenkins
        annotations:
          summary: "Jenkins controller is unreachable or down"
          description: "Jenkins controller has been unreachable for more than 30 seconds. Failover or JCasC auto-rescheduling must be verified."

      # 2. Alert if any Kubernetes Node is NotReady
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 1m
        labels:
          severity: critical
          component: kubernetes-ha
        annotations:
          summary: "Kubernetes Node is in NotReady state"
          description: "Node {{ $labels.node }} in cluster is down or partitioned. Workloads must reschedule via PDB."

      # 3. Alert if Central Automation Tracker is degraded
      - alert: AutomationTrackerDown
        expr: up{job="automation-tracker"} == 0
        for: 30s
        labels:
          severity: high
          component: tracker
        annotations:
          summary: "Automation Tracker backend is down"
          description: "Test execution telemetry ingestion is paused. Verify pod replicas and database connectivity."

      # 4. Alert if Persistent Volume usage exceeds 85%
      - alert: PersistentVolumeNearFull
        expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
        for: 2m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Persistent volume space running low (> 85%)"
          description: "Volume {{ $labels.persistentvolumeclaim }} is near capacity."
