# Prometheus Configuration for High Availability QE Platform
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert-rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Central Automation Tracker Telemetry API
  - job_name: "automation-tracker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["tracker-backend:8000"]

  # 3. Jenkins Controller High Availability Monitoring
  - job_name: "jenkins"
    metrics_path: "/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8088"]

  # 4. Kubernetes Nodes & Control Plane (in-cluster or local kind)
  - job_name: "kubernetes-apiservers"
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
